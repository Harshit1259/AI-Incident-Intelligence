name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath ./cmd/server

      - name: Test
        run: go test -race -cover ./...

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  # ── Security gate ─────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ── Repo hygiene ──────────────────────────────────────────────────────────────
  hygiene:
    name: Repo hygiene check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: No .env in repo
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "✗  .env is tracked by git — remove it with: git rm --cached .env"
            exit 1
          fi
          echo "✓ No .env tracked"

      - name: No backup files in repo
        run: |
          BAD=$(git ls-files | grep -E '\.(bak|orig)$|~$|\.backup_' || true)
          if [[ -n "$BAD" ]]; then
            echo "✗  Backup files tracked:"
            echo "$BAD"
            exit 1
          fi
          echo "✓ No backup files tracked"

      - name: No built binaries in repo
        run: |
          BAD=$(git ls-files | xargs -I{} sh -c 'test -f "{}" && file "{}" | grep -l "ELF\|Mach-O\|PE32" 2>/dev/null || true' || true)
          if [[ -n "$BAD" ]]; then
            echo "✗  Built binaries tracked:"
            echo "$BAD"
            exit 1
          fi
          echo "✓ No binaries tracked"

      - name: No node_modules in repo
        run: |
          if git ls-files | grep -q node_modules; then
            echo "✗  node_modules is tracked by git"
            exit 1
          fi
          echo "✓ No node_modules tracked"

      - name: No dist in repo
        run: |
          if git ls-files | grep -E '^(frontend/dist|dist)/' | head -1 | grep -q .; then
            echo "✗  Built dist directory is tracked by git"
            exit 1
          fi
          echo "✓ No dist tracked"
